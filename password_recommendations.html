<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Step 3 of 3</title>
    <!-- We are using the same consistent card style UI -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #eef1f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 20px; margin: 0; }
        .form-container { background-color: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { font-size: 1.8rem; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .dropdown-row { display: flex; gap: 20px; text-align: left; }
        .form-group { flex: 1; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 0.9rem; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        button[type="submit"] { width: 100%; max-width: 400px; margin: 20px auto 0; display: block; padding: 15px; border: none; border-radius: 4px; background-color: #28a745; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        button[type="submit"]:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>MindLock: AI Password Generator</h1>
        <p class="subtitle">Recommendation Password based on your Answer</p>
        
        <form action="/finalize-registration" method="post">
            <!-- Hidden fields to carry over all previous data -->
            {% for key, value in user_data.items() %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endfor %}

            <div class="dropdown-row">
                <div class="form-group">
                    <label>Choose your new password:</label>
                    <select name="password" required>
                        {% for pw in generated_passwords %}
                            <option value="{{ pw }}">{{ pw }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>For which platform?</label>
                    <select name="platform">
                        {% for platform in social_media_options %}
                            <option value="{{ platform }}">{{ platform }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
