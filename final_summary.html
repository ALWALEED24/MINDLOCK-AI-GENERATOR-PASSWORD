<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Complete</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #eef1f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .summary-container { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #28a745; margin-bottom: 15px; }
        p { color: #666; font-size: 1.1rem; line-height: 1.6; }
        .details { margin: 25px 0; padding: 15px; background-color: #f8f9fa; border-radius: 4px; }
        strong { color: #333; }
        .home-link { display: inline-block; text-align: center; margin-top: 30px; padding: 15px 30px; border-radius: 4px; background-color: #007bff; color: white; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="summary-container">
        <h1>Success!</h1>
        <p>Your account for <strong>{{ username }}</strong> has been created.</p>
        <div class="details">
            <p>Your password for <strong>{{ platform }}</strong> is:<br><strong>{{ password }}</strong></p>
        </div>
        <a href="/" class="home-link">Back to Homepage</a>
    </div>
</body>
</html>
