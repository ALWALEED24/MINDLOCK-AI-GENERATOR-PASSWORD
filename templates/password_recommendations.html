<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Recommendations - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .rec-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 3. TYPOGRAPHY --- */
        .icon-header {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #4ca1af;
            filter: drop-shadow(0 0 10px rgba(76, 161, 175, 0.5));
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 30px; }

        /* --- 4. FORM ELEMENTS --- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        label i { color: #4ca1af; margin-right: 5px; }

        /* Custom Select & Input Styling */
        select, input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1); /* Darker glass */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white; /* Important for dark bg */
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            appearance: none; /* Removes default arrow to style custom */
        }

        /* Add custom arrow for select */
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '\f107'; /* FontAwesome Down Arrow */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }

        /* Focus Effects */
        select:focus, input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #4ca1af;
            box-shadow: 0 0 10px rgba(76, 161, 175, 0.5);
        }

        /* Dropdown Options (Dark because browser handles them differently) */
        option {
            background-color: #2c3e50;
            color: white;
        }

        /* --- 5. BUTTON --- */
        .btn-next {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-next:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.6);
        }

    </style>
</head>
<body>

    <div class="rec-card">
        
        <div class="icon-header">
            <i class="fas fa-brain"></i>
        </div>

        <h1>AI Recommendations</h1>
        <p>We generated these passwords based on your personality.</p>

        <!-- Points to the Visual Hint Page (Next Step) -->
        <form action="/visual-hint" method="post">
            
            <!-- 1. HIDDEN FIELD: Map Master Password to 'app_password' -->
            <input type="hidden" name="app_password" value="{{ user_data.password }}">

            <!-- 2. HIDDEN FIELDS: Loop other data, skip 'password' to avoid conflict -->
            {% for key, value in user_data.items() %}
                {% if key != 'password' %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
                {% endif %}
            {% endfor %}

            <!-- Username Input -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" value="{{ user_data.username }}" required>
            </div>

            <!-- Platform Selection -->
            <div class="form-group">
                <label><i class="fas fa-globe"></i> For which platform?</label>
                <div class="select-wrapper">
                    <select name="platform">
                        {% for platform in social_media_options %}
                            <option value="{{ platform }}">{{ platform }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Generated Password Selection -->
            <div class="form-group">
                <label><i class="fas fa-key"></i> Select a strong password</label>
                <div class="select-wrapper">
                    <select name="password" required>
                        {% for pw in generated_passwords %}
                            <option value="{{ pw }}">{{ pw }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-next">
                Next Step <i class="fas fa-arrow-right"></i>
            </button>
        </form>

    </div>

</body>
</html>
