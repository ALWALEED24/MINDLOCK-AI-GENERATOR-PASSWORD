<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .reset-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: floatUp 0.8s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 3. TYPOGRAPHY --- */
        .icon-header {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 30px; }
        strong { color: #00c6ff; }

        /* --- 4. INPUTS --- */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            top: 50%; left: 15px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.4);
        }

        /* --- 5. STRENGTH METER --- */
        .strength-container {
            text-align: left;
            margin-bottom: 25px;
            margin-top: -10px;
            padding-left: 10px;
        }
        
        .strength-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            background: red;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }

        /* --- 6. BUTTON --- */
        .btn-reset {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .btn-reset:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.6);
        }

    </style>
</head>
<body>

    <div class="reset-card">
        
        <div class="icon-header">
            <i class="fas fa-shield-alt"></i>
        </div>

        <h1>Reset Password</h1>
        <p>Set a new secure password for <strong>{{ platform }}</strong></p>

        <form action="/perform-reset" method="post" onsubmit="return validateForm()">
            
            <!-- Hidden Fields -->
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="platform" value="{{ platform }}">

            <!-- New Password -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="new_pass" name="new_password" placeholder="New Password" required onkeyup="checkStrength()">
            </div>

            <!-- Strength Meter -->
            <div class="strength-container">
                <div class="strength-bar-bg">
                    <div class="strength-bar-fill" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText">Strength: None</div>
            </div>

            <!-- Re-enter Password -->
            <div class="input-group">
                <i class="fas fa-check-circle"></i>
                <input type="password" id="confirm_pass" placeholder="Re-enter Password" required>
            </div>

            <button type="submit" class="btn-reset">Update Password</button>
        </form>

    </div>

    <script>
        function checkStrength() {
            const password = document.getElementById('new_pass').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length > 5) strength += 1;
            if (password.length > 10) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            if (strength <= 1) {
                bar.style.width = '20%';
                bar.style.background = '#ff4d4d'; // Red
                text.innerText = 'Strength: Weak';
                text.style.color = '#ff4d4d';
            } else if (strength <= 3) {
                bar.style.width = '60%';
                bar.style.background = '#ffcc00'; // Yellow/Orange
                text.innerText = 'Strength: Medium';
                text.style.color = '#ffcc00';
            } else {
                bar.style.width = '100%';
                bar.style.background = '#00e676'; // Green
                text.innerText = 'Strength: Strong';
                text.style.color = '#00e676';
            }
        }

        function validateForm() {
            const p1 = document.getElementById('new_pass').value;
            const p2 = document.getElementById('confirm_pass').value;
            if (p1 !== p2) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>

</body>
</html>
