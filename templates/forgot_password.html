<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - MindLock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Reuse your CSS from login.html here (Background, Glass Card, etc) -->
    <style>
        /* (Copy CSS from login.html) or use this minimal set */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); padding: 40px; border-radius: 20px;
            text-align: center; width: 100%; max-width: 400px;
        }
        input { width: 90%; padding: 15px; margin: 20px 0; border-radius: 10px; border: none; }
        button { width: 100%; padding: 15px; border-radius: 30px; border: none; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; font-weight: bold; cursor: pointer;}
        .error { color: #ff6b6b; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Recovery</h1>
        <p>Enter the email associated with your account.</p>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/send-reset-email" method="post">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>
        <br>
        <a href="/login" style="color:white;">Back to Login</a>
    </div>
</body>
</html>
