<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .success-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- 3. SUCCESS ICON --- */
        .icon-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.2); /* Light Green transparent */
            border: 2px solid #00e676;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            color: #00e676;
            font-size: 3rem;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* --- 4. TEXT --- */
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* --- 5. BUTTON --- */
        .btn-login {
            display: inline-block;
            width: 100%;
            padding: 15px 0;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%); /* Green Gradient */
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.6);
        }

    </style>
</head>
<body>

    <div class="success-card">
        
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>

        <h1>Password Changed!</h1>
        <p>Your security vault has been updated successfully.</p>

        <a href="/login" class="btn-login">Log In Now</a>

    </div>

</body>
</html>
