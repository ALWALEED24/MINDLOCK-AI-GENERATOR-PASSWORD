<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Master Password - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 3. ICONS & TEXT --- */
        .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 30px; }
        strong { color: #00c6ff; }

        /* --- 4. INPUTS --- */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            top: 50%; left: 15px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.4);
        }

        /* --- 5. BUTTON --- */
        .btn-update {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .btn-update:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.6);
        }

    </style>
</head>
<body>

    <div class="card">
        
        <div class="icon-circle">
            <i class="fas fa-key"></i>
        </div>

        <h1>Reset Master Password</h1>
        <p>Set a new password for <strong>{{ email }}</strong></p>

        <form action="/finalize-master-reset" method="post" onsubmit="return validateForm()">
            <!-- Hidden Email so backend knows who to update -->
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="pass1" name="new_password" placeholder="New Master Password" required>
            </div>

            <div class="input-group">
                <i class="fas fa-check-circle"></i>
                <input type="password" id="pass2" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-update">Update Password</button>
        </form>

    </div>

    <script>
        function validateForm() {
            var p1 = document.getElementById("pass1").value;
            var p2 = document.getElementById("pass2").value;
            if(p1 !== p2) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>

</body>
</html>
