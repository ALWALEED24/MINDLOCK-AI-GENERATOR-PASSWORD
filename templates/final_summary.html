<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Complete - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .summary-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: zoomIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes zoomIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- 3. SUCCESS ICON --- */
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.2);
            border: 2px solid #00e676;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #00e676;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* --- 4. DETAILS LIST --- */
        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p.subtitle { font-size: 0.95rem; opacity: 0.8; margin-bottom: 30px; }

        .details-box {
            background: rgba(0, 0, 0, 0.2); /* Darker inner box */
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-row:last-child { border-bottom: none; }

        .label { color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; }
        .value { font-weight: 600; font-size: 1rem; color: white; }
        
        /* Highlight the password */
        .value.highlight { color: #00e676; letter-spacing: 1px; font-family: monospace; }

        /* --- 5. BUTTON --- */
        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 15px 0;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-home:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.6);
        }

    </style>
</head>
<body>

    <div class="summary-card">
        
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>

        <h1>Secured!</h1>
        <p class="subtitle">Your data has been encrypted and stored.</p>

        <div class="details-box">
            <div class="detail-row">
                <span class="label">Platform</span>
                <span class="value">{{ platform }}</span>
            </div>
            <div class="detail-row">
                <span class="label">Username</span>
                <span class="value">{{ username }}</span>
            </div>
            <div class="detail-row">
                <span class="label">Password</span>
                <span class="value highlight">{{ password }}</span>
            </div>
            <!-- Optional: Show the Visual Hint Name -->
            <div class="detail-row">
                <span class="label">Visual Hint</span>
                <span class="value" style="text-transform: capitalize;">{{ image_hint }}</span>
            </div>
            <div class="detail-row">
                <span class="label">Email</span>
                <span class="value" style="font-size: 0.9rem;">{{ email }}</span>
            </div>
        </div>

        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> Back to Main Page
        </a>

    </div>

</body>
</html>
