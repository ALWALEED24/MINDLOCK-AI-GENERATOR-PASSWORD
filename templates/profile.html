<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - MindLock AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        /* --- 2. GLASS CARD --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 3. TYPOGRAPHY --- */
        .icon-header {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #fc6767;
            filter: drop-shadow(0 0 10px rgba(252, 103, 103, 0.5));
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 30px; }

        /* --- 4. INPUTS --- */
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: rgba(255,255,255,0.8); }
        .input-group input {
            width: 100%; padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; color: white; font-size: 1rem; outline: none;
            box-sizing: border-box; transition: 0.3s; font-family: 'Poppins', sans-serif;
        }
        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fc6767;
            box-shadow: 0 0 10px rgba(252, 103, 103, 0.4);
        }

        /* --- VALIDATION STYLES (NEW) --- */
        .input-error {
            border-color: #ff4d4d !important;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4) !important;
        }
        .input-success {
            border-color: #00e676 !important;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4) !important;
        }

        /* Requirements Box */
        #password-requirements {
            display: none; /* Hidden until typing starts */
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #password-requirements h4 { margin: 0 0 10px 0; font-size: 0.9rem; color: #fc6767; }
        .req-item { font-size: 0.8rem; margin-bottom: 5px; color: #ff4d4d; transition: 0.3s; }
        .req-item.valid { color: #00e676; }
        .req-item i { width: 15px; }

        .input-read-only { opacity: 0.6; cursor: not-allowed; }

        /* --- 5. BUTTONS --- */
        .btn-gradient {
            width: 100%; padding: 15px;
            background: linear-gradient(90deg, #ec008c, #fc6767);
            border: none; border-radius: 30px;
            color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(236, 0, 140, 0.4);
        }
        .btn-gradient:hover { transform: scale(1.02); }

        .btn-back {
            display: inline-block; margin-top: 20px;
            color: rgba(255, 255, 255, 0.6); text-decoration: none; font-size: 0.9rem;
        }
        .btn-back:hover { color: white; }

        .message { color: #00e676; margin-bottom: 15px; font-weight: bold; }
        .error-text { color: #ff4d4d; margin-top: 5px; font-size: 0.85rem; display: none; }
        .error-banner { color: #ff4d4d; margin-bottom: 15px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="profile-card">
        <div class="icon-header"><i class="fas fa-user-cog"></i></div>
        <h1>Edit Profile</h1>
        <p>Update your personal details.</p>

        {% if message %} <div class="message"><i class="fas fa-check-circle"></i> {{ message }}</div> {% endif %}
        {% if error %} <div class="error-banner"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div> {% endif %}

        <form action="/update-profile" method="post" onsubmit="return validateForm()">
            
            <input type="hidden" name="original_email" value="{{ email }}">
            <input type="hidden" name="original_password" value="{{ password }}">

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="new_username" value="{{ username }}">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="new_email" value="{{ email }}" required>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">

            <!-- NEW PASSWORD FIELD -->
            <div class="input-group">
                <label>New Master Password (Optional)</label>
                <input type="password" id="new_pass" name="new_password" placeholder="Leave empty to keep current" onkeyup="checkPasswordRealTime()">
            </div>

            <!-- PASSWORD REQUIREMENTS CHECKLIST -->
            <div id="password-requirements">
                <h4>Password Must Contain:</h4>
                <div id="rule-len" class="req-item"><i class="fas fa-times"></i> At least 8 characters</div>
                <div id="rule-upper" class="req-item"><i class="fas fa-times"></i> Uppercase letter (A-Z)</div>
                <div id="rule-lower" class="req-item"><i class="fas fa-times"></i> Lowercase letter (a-z)</div>
                <div id="rule-num" class="req-item"><i class="fas fa-times"></i> Number (0-9)</div>
                <div id="rule-sym" class="req-item"><i class="fas fa-times"></i> Symbol (!@#$%)</div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_pass" placeholder="Repeat password">
                <div id="match-error" class="error-text">Passwords do not match!</div>
            </div>

            <button type="submit" class="btn-gradient">Save Changes</button>
        </form>

        <form action="/dashboard" method="post" id="backForm">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="password" value="{{ password }}">
        </form>
        <a href="#" onclick="document.getElementById('backForm').submit()" class="btn-back">Back to Dashboard</a>

    </div>

    <script>
        function checkPasswordRealTime() {
            const password = document.getElementById('new_pass').value;
            const reqBox = document.getElementById('password-requirements');
            const inputField = document.getElementById('new_pass');

            // If empty, hide checklist and reset style
            if (password.length === 0) {
                reqBox.style.display = 'none';
                inputField.classList.remove('input-error', 'input-success');
                return;
            }

            // Show checklist
            reqBox.style.display = 'block';

            // Rules
            const hasLen = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNum = /[0-9]/.test(password);
            const hasSym = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            // Update UI for each rule
            updateRule('rule-len', hasLen);
            updateRule('rule-upper', hasUpper);
            updateRule('rule-lower', hasLower);
            updateRule('rule-num', hasNum);
            updateRule('rule-sym', hasSym);

            // Overall Status
            if (hasLen && hasUpper && hasLower && hasNum && hasSym) {
                inputField.classList.remove('input-error');
                inputField.classList.add('input-success');
                return true;
            } else {
                inputField.classList.remove('input-success');
                inputField.classList.add('input-error'); // SHOWS RED BORDER
                return false;
            }
        }

        function updateRule(elementId, isValid) {
            const el = document.getElementById(elementId);
            if (isValid) {
                el.classList.add('valid');
                el.innerHTML = '<i class="fas fa-check"></i> ' + el.innerText.substring(2);
            } else {
                el.classList.remove('valid');
                el.innerHTML = '<i class="fas fa-times"></i> ' + el.innerText.substring(2);
            }
        }

        function validateForm() {
            const p1 = document.getElementById('new_pass').value;
            const p2 = document.getElementById('confirm_pass').value;
            const errorMsg = document.getElementById('match-error');

            // Only validate if user typed a password
            if (p1.length > 0) {
                // 1. Check Format (Must be all green)
                if (!checkPasswordRealTime()) {
                    alert("Password does not meet complexity requirements!");
                    return false;
                }
                // 2. Check Match
                if (p1 !== p2) {
                    errorMsg.style.display = 'block';
                    return false;
                }
            }
            return true;
        }
    </script>

</body>
</html>
