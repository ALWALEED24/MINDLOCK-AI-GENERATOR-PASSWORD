<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Anchor - MindLock</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #4ca1af, #2c3e50);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. GLASS CARD --- */
        .visual-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- 3. TYPOGRAPHY --- */
        .icon-header {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #00e676;
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.4));
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 30px; }
        strong { color: #00e676; }

        /* --- 4. IMAGE GRID --- */
        .image-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .img-option {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            object-fit: contain;
        }

        .img-option:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .img-option.selected {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.1);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.5);
            transform: scale(1.1);
        }

        /* --- 5. BUTTON --- */
        .btn-next {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-next:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.6);
        }

    </style>
</head>
<body>

    <div class="visual-card">
        
        <div class="icon-header">
            <i class="fas fa-eye"></i>
        </div>

        <h1>Visual Memory Anchor</h1>
        <!-- Using {{ data.platform }} because platform is now inside the data dictionary -->
        <p>Select an image to associate with your <strong>{{ data.platform }}</strong> password.</p>

        <form action="/face-verify" method="post">
            
            <!-- AUTOMATICALLY PASS ALL PREVIOUS DATA (Email, Pass, Survey) -->
            {% for key, value in data.items() %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endfor %}

            <!-- Chosen Image Input -->
            <input type="hidden" id="image_hint" name="image_hint" value="{{ security_icons[0].name }}" required>

            <div class="image-row">
                {% for icon in security_icons %}
                    <img 
                        src="{{ icon.url }}" 
                        class="img-option {% if loop.first %}selected{% endif %}" 
                        onclick="selectImage(this, '{{ icon.name }}')"
                        alt="{{ icon.name }}"
                    >
                {% endfor %}
            </div>

            <button type="submit" class="btn-next">
                Secure & Continue <i class="fas fa-arrow-right"></i>
            </button>
        </form>

    </div>

    <script>
        function selectImage(el, name) {
            document.querySelectorAll('.img-option').forEach(img => img.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('image_hint').value = name;
        }
    </script>

</body>
</html>
