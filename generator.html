<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLock: AI Password Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #4a5568; }
        .card { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); width: 100%; max-width: 550px; text-align: center; }
        h1 { font-size: 1.75rem; color: #2d3748; margin-bottom: 8px; }
        .subtitle { color: #718096; margin-bottom: 30px; }
        .form-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .form-group { flex: 1; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; background-color: #4a5568; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2d3748; }
        .footer { margin-top: 25px; font-size: 0.9rem; color: #718096; }
        .footer a { color: #4299e1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MindLock: AI Password Generator</h1>
        <p class="subtitle">Recommendation Password based on your Answer</p>
        
        <form action="/generate" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="base_input">Base Input:</label>
                    <input type="text" id="base_input" name="base_input" placeholder="e.g., my_name#123,my_hobby" required>
                </div>
                <div class="form-group">
                    <label for="platform">Platform</label>
                    <select id="platform" name="platform">
                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>Gmail</option>
                        <option>Twitter</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            <button type="submit">Continue</button>
        </form>
    </div>
    <div class="footer">
        <p>Need help? <a href="#">Contact support</a></p>
    </div>
</body>
</html>
