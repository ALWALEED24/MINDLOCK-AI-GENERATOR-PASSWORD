<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Step 2 of 2</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #eef1f4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .form-container { 
            background-color: white; 
            padding: 40px 50px; /* Increased padding */
            border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); 
            width: 100%; 
            max-width: 900px; /* Adjusted max-width for better fit with 3 columns */
            text-align: center; 
        }
        
        h1 {
            font-size: 2rem; /* Slightly larger title */
            color: #2c3e50;
            margin-bottom: 5px;
            font-weight: 600; /* Bolder title */
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 40px; /* More space below subtitle */
            font-size: 1.1rem; /* Slightly larger subtitle */
        }

        .survey-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px 25px; /* Increased row and column gap */
            text-align: left; 
        }
        .form-group { 
            margin-bottom: 0; /* No extra margin for groups in grid */
        }
        label { 
            display: block; 
            margin-bottom: 10px; /* More space between label and input */
            color: #555; 
            font-weight: 500; 
            font-size: 0.95rem; /* Slightly larger label font */
        }
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            transition: border-color 0.3s; /* Smooth transition on focus */
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #007bff; /* Highlight border on focus */
            outline: none; /* Remove default outline */
        }

        button[type="submit"] { 
            width: 100%; 
            max-width: 450px; /* Wider button */
            margin: 50px auto 0; /* More space above button */
            display: block; 
            padding: 15px 25px; /* More padding for button */
            border: none; 
            border-radius: 5px; /* Slightly more rounded corners */
            background-color: #28a745; /* Green button */
            color: white; 
            font-size: 1.1rem; /* Larger button text */
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.3s, transform 0.2s; /* Added transform for subtle animation */
        }
        button[type="submit"]:hover { 
            background-color: #218838; 
            transform: translateY(-2px); /* Slight lift on hover */
        }
        button[type="submit"]:active {
            transform: translateY(0); /* Press effect */
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>MindLock: AI Password Generator</h1>
        <p class="subtitle">Answer The Survey.</p>
        
        <form action="/register" method="post">
            <!-- Hidden fields to pass email and password from Step 1 -->
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="password" value="{{ password }}">

            <div class="survey-grid">
                <!-- Column 1 -->
                <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
                <div class="form-group"><label>Nickname</label><input type="text" name="nickname"></div>
                <div class="form-group"><label>Favourite Number</label><input type="text" name="favourite_number"></div>
                
                <!-- Column 2 -->
                <div class="form-group"><label>Hobby</label><input type="text" name="hobby"></div>
                <div class="form-group"><label>Favourite Food</label><input type="text" name="favourite_food"></div>
                <div class="form-group"><label>Favourite Sport</label><input type="text" name="favourite_sport"></div>
                
                <!-- Column 3 -->
                <div class="form-group"><label>Favourite subject</label><input type="text" name="favourite_subject"></div>
                <div class="form-group"><label>Favourite book</label><input type="text" name="favourite_book"></div>
                <div class="form-group"><label>Childhood Nickname</label><input type="text" name="childhood_nickname"></div>

                <!-- New Row for remaining fields to maintain 3-column structure visually -->
                <div class="form-group"><label>Favourite Celebrity</label><input type="text" name="favourite_celebrity"></div>
                <div class="form-group"><label>Sibling position</label><input type="number" name="sibling_position"></div>
                <div class="form-group"><label>Ambition</label><input type="text" name="ambition"></div>

                <div class="form-group"><label>Favourite place</label><input type="text" name="favourite_place"></div>
                <div class="form-group"><label>Favourite cafe</label><input type="text" name="favourite_cafe"></div>
                <div class="form-group"></div> <!-- Empty div to keep grid alignment if needed -->
            </div>
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
